[build-system]
# Build-time only dependencies. Cython and numpy must be declared here or
# they cannot be imported under pip's build isolation (0.2.10 did not declare
# them, so building from the sdist always failed).
# ビルド時にのみ必要な依存関係。
# Cython / numpy はここで宣言しないと pip のビルド分離下で import できない
# (0.2.10 ではこれが宣言されておらず、sdist ビルドが必ず失敗していた)。
requires = [
    "setuptools>=77",
    "Cython>=3.0",
    "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "lpu"
dynamic = ["version"]
description = "A Language Processing Utility"
readme = "README.md"
# Python 3.9 reached EOL in 2025-10, so 3.10 is the lower bound.
# Python 3.9 は 2025-10 に EOL 済みのため 3.10 を下限とする
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Akiva Miura", email = "akiva.miura@gmail.com" },
]
keywords = [
    "CL",
    "NLP",
    "computational linguistics",
    "natural language processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
# The core features (lpu.common.*, lpu.commands.*, lpu.metrics.*,
# lpu.data_structs.trees) run on the standard library alone, so there are
# no runtime dependencies.
# コア機能 (lpu.common.*, lpu.commands.*, lpu.metrics.*, lpu.data_structs.trees)
# は標準ライブラリのみで動作するため、実行時依存は無し
dependencies = []

[project.optional-dependencies]
# numpy powers the EM loops of lpu.smt.align (ibm_models). numpy publishes
# wheels for every supported platform, including Windows.
# (lpu.smt.align の EM ループで numpy を使う。numpy は Windows を含む
#  サポート対象の全プラットフォームで wheel が提供されている)
smt = [
    "numpy>=1.19",
]
# pycedar backs the Double-Array Trie (lpu.data_structs.trie). It publishes
# no Windows wheel, so the trie features are unavailable there.
# (Double-Array Trie は pycedar による。Windows 向けの wheel が無いため
#  同プラットフォームでは trie 系機能は利用できない)
trie = [
    "pycedar>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/akivajp/lpu"
Repository = "https://github.com/akivajp/lpu"
Issues = "https://github.com/akivajp/lpu/issues"

[project.scripts]
lpu-abspath = "lpu.commands.abspath:main"
lpu-clean-parallel = "lpu.commands.clean_parallel:main"
lpu-dialog = "lpu.commands.dialog:main"
lpu-exec-parallel = "lpu.commands.exec_parallel:main"
lpu-guess-langcode = "lpu.commands.guess_langcode:main"
lpu-progress = "lpu.commands.progress:main"
lpu-random-split = "lpu.commands.random_split:main"
lpu-wait-files = "lpu.commands.wait_files:main"
lpu-word-align-train = "lpu.smt.align.ibm_models:main_train"
lpu-word-align-score = "lpu.smt.align.ibm_models:main_score"
# SMT phrase/rule table tools. These had a main() but were never registered,
# so they were unreachable from the command line.
# SMT のフレーズ/ルールテーブル操作ツール。main() を持ちながら未登録で、
# コマンドラインから到達できない状態だった。
lpu-smt-convert-extract = "lpu.smt.trans_models.convert_extract:main"
lpu-smt-filter = "lpu.smt.trans_models.filter:main"
lpu-smt-make-glue-rules = "lpu.smt.trans_models.make_glue_rules:main"
lpu-smt-normalize = "lpu.smt.trans_models.normalize:main"
lpu-smt-triangulate = "lpu.smt.trans_models.triangulate:main"

# Development dependencies, installed by `uv sync` / `uv run`
# 開発用の依存関係。`uv sync` / `uv run` でインストールされる
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "numpy>=2.0",
    "pycedar>=0.2.0",
    "ruff>=0.13",
    "mypy>=1.11",
]

[tool.ruff.lint]
# Only rules that catch real defects are enabled for now. The codebase
# mixes camelCase / snake_case legacy naming, so style rules stay off.
# 今のところ実害を捉えるルールのみ有効化。レガシー命名が混在しているため
# スタイル系のルールは対象外とする。
select = [
    "B",    # bugbear: real defect patterns
    "E722", # bare except
    "E9",   # runtime / syntax errors
    "F",    # pyflakes: unused imports / variables, undefined names
    "UP",   # pyupgrade: modernize for the supported Python (>= 3.10)
]

[tool.ruff.lint.per-file-ignores]
# trie.py is a Cython source: `long` / `string` inside @cython.locals are
# Cython type names, not Python names, so F821 misfires on them.
# (trie.py は Cython ソース。@cython.locals 内の long / string は
#  Cython の型名であり Python の名前ではないため F821 が誤検出する)
"lpu/data_structs/trie.py" = ["F821"]

[tool.mypy]
# Gradual adoption: only the modules annotated so far are type-checked.
# New modules should be added here as their annotations land.
# 段階的導入のため、型注釈済みのモジュールのみを検査対象とする。
# 新規モジュールは注釈を付けてここに追加していく。
files = [
    "lpu/commands/abspath.py",
    "lpu/commands/clean_parallel.py",
    "lpu/commands/dialog.py",
    "lpu/commands/exec_parallel.py",
    "lpu/commands/guess_langcode.py",
    "lpu/commands/progress.py",
    "lpu/commands/random_split.py",
    "lpu/commands/wait_files.py",
    "lpu/common/colors.py",
    "lpu/common/config.py",
    "lpu/common/dialog.py",
    "lpu/common/environ.py",
    "lpu/common/files.py",
    "lpu/common/logging.py",
    "lpu/common/numbers.py",
    "lpu/common/progress.py",
    "lpu/common/text.py",
    "lpu/common/validation.py",
    "lpu/common/vocab.py",
    "lpu/data_structs/trees.py",
    "lpu/metrics/bleu.py",
    "lpu/metrics/ribes.py",
    "lpu/smt/trans_models/convert_extract.py",
    "lpu/smt/trans_models/filter.py",
    "lpu/smt/trans_models/make_glue_rules.py",
    "lpu/smt/trans_models/normalize.py",
]
# Follow imports (e.g. lpu.common.logging) without reporting the errors
# of the not-yet-annotated imported modules.
# import 先 (未注釈モジュール) のエラーは報告せず、解決のみを行う
follow_imports = "silent"

# The compiled Cython extension modules have no stubs, so their imports
# are treated as missing; accept them as Any.
# (コンパイル済み Cython 拡張モジュールには stub が無いため欠落扱いになる。
#  Any として受け入れる)
[[tool.mypy.overrides]]
module = [
    "lpu.smt.trans_models.records",
    "lpu.smt.trans_models.tables",
]
ignore_missing_imports = true

[tool.setuptools.dynamic]
version = { file = "lpu/VERSION" }

[tool.setuptools.packages.find]
include = ["lpu*"]

[tool.setuptools.package-data]
# VERSION is read at runtime; .pxd / .pyx are needed to rebuild from the sdist.
# py.typed marks the package as typed (PEP 561) for downstream type checkers.
# VERSION は実行時に読み込まれる。.pxd / .pyx は sdist からの再ビルドに必要。
# py.typed は PEP 561 により、下流の型チェッカーへ型注釈を公開する印。
lpu = ["VERSION", "py.typed"]
"*" = ["*.pxd", "*.pyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lpu"]
# Subprocess auto-measurement (COVERAGE_PROCESS_START) creates a Coverage
# without a data suffix, so without this flag every subprocess would
# overwrite the same .coverage file. parallel = true makes each process
# write .coverage.<pid>, which pytest-cov's combine step merges.
# (サブプロセス自動計測は data suffix 無しで Coverage を作るため、
#  この指定が無いと全子プロセスが同一 .coverage を相互上書きする。
#  parallel = true により各プロセスが .coverage.<pid> に書き出し、
#  pytest-cov の combine で統合される)
parallel = true
# The compiled Cython modules cannot be traced by coverage.py; they are
# exercised through their Python-visible surfaces instead.
# (コンパイル済み Cython モジュールは coverage.py で計測できないため除外)
omit = [
    "lpu/data_structs/trie.py",
    "lpu/smt/align/*.pyx",
    "lpu/smt/trans_models/*.pyx",
    "lpu/common/compat.py",
]

[tool.coverage.report]
# show the modules with the least coverage first
# (カバレッジの低いモジュールから表示する)
sort = "cover"

[tool.cibuildwheel]
# Only the interpreters that the test matrix actually covers.
# Free-threaded builds (cp3XXt-*) are deliberately excluded: they do not match
# these patterns, and the extensions have not been validated without the GIL.
# (テスト済みのインタプリタのみを対象にする。
#  フリースレッド版はGIL無しでの検証が済んでいないため意図的に対象外)
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
build-frontend = "build"
test-requires = "pytest"
# The smt and trie extras bring numpy and pycedar, so the compiled modules
# are actually exercised by the test run of each built wheel.
# (smt / trie エクストラにより numpy と pycedar が入るため、ビルドした
#  wheel ごとのテストでコンパイル済みモジュールも実際に検証される)
# The list form joins the extras with commas; a space-separated string is
# passed to pip verbatim as "[smt trie]", which is a syntax error.
# (リスト形式はカンマで結合される。空白区切りの文字列はそのまま
#  "[smt trie]" として pip に渡され、構文エラーになるため不可)
test-extras = ["smt", "trie"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
# Cross-compile the Intel wheels from the Apple silicon runner.
# cibuildwheel skips the test step for wheels it cannot run natively.
# (arm64ランナーからx86_64をクロスビルドする。実行できないwheelのテストは自動でスキップされる)
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
# pycedar has no Windows wheel, so the trie extra (and with it the
# trie-dependent tests) is left out there; the rest of the suite still
# runs against the wheel.
# (Windows には pycedar の wheel が無いため trie エクストラは省略する。
#  残りのテストは wheel に対して実行される)
test-extras = ["smt"]
