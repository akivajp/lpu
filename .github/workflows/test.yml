# Test workflow / テストワークフロー
#
# The test suite is run against the *installed* package rather than the
# source tree, so that the Cython extensions are actually exercised. This
# is why pytest is invoked from a different working directory.
#
# テストは、Cython 拡張を実際に動かすため、ソースツリーではなく
# インストール済みのパッケージに対して実行する。そのため pytest は別の
# 作業ディレクトリから起動している。
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint with ruff. Only correctness-oriented rules are enabled for now
  # (see [tool.ruff.lint] in pyproject.toml), because the codebase mixes
  # legacy naming styles that style rules would flood us with.
  # (ruff による lint。スタイル系ルールは現状無効のため、実害系のみ)
  lint:
    name: lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install ruff mypy
      - run: ruff check .
      # mypy checks only the annotated modules listed in [tool.mypy]
      # (mypy は [tool.mypy] の files に列挙した注釈済みモジュールのみ検査する)
      - run: mypy

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with the smt and trie extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[smt,trie]' pytest

      - name: Report which features are available
        run: |
          python -c "import lpu; print('lpu', lpu.__version__, 'from', lpu.__file__)"
          python -c "import lpu.smt.align.ibm_models; print('smt.align: OK')"
          python -c "import lpu.data_structs.trie; print('data_structs.trie: OK')"
        working-directory: ${{ runner.temp }}

      - name: Run the test suite against the installed package
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -v
        working-directory: ${{ runner.temp }}

  # Measure coverage once, on a single job. The command tests run their
  # targets in subprocesses; run_command() routes their coverage data to
  # the repository root (COVERAGE_FILE + parallel = true), so pytest-cov
  # combines all of it at the end.
  # (カバレッジは単一ジョブで計測する。コマンドテストは対象をサブプロセス
  #  で起動するため、run_command() が子プロセスのカバレッジデータを
  #  リポジトリルートへ集め、最後に pytest-cov が統合する)
  test-coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the package with the smt and trie extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[smt,trie]' 'pytest' 'pytest-cov'

      - name: Run the test suite with coverage
        env:
          # Pin the parent's data file to the repository root, matching the
          # location run_command() gives the subprocesses, so that combine
          # picks up both.
          # (親プロセスのデータファイルもリポジトリルートに固定し、
          #  子プロセスのものと合わせて combine されるようにする)
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: >
          python -m pytest "$GITHUB_WORKSPACE/tests"
          --cov --cov-config="$GITHUB_WORKSPACE/pyproject.toml"
          --cov-report=term-missing
        working-directory: ${{ runner.temp }}

      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true

  # Windows has no pycedar wheel, so the Double-Array Trie features are
  # unavailable there and their tests skip themselves.
  # Windows には pycedar の wheel が無いため、Double-Array Trie 系の機能は
  # 利用できず、該当テストは自動的にスキップされる。
  test-windows:
    name: windows-latest / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with the smt extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[smt]' pytest

      - name: Run the test suite against the installed package
        run: python -m pytest "$env:GITHUB_WORKSPACE/tests" -v
        working-directory: ${{ runner.temp }}

  # Verify that the package remains installable and usable with no C
  # extensions at all, which is the safety net of setup.py's optional=True.
  # C 拡張を一切ビルドしない状態でもインストールでき、利用できることを確認する
  # (setup.py の optional=True による保険の検証)。
  test-pure-python:
    name: pure Python (no extensions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install without building the extensions
        env:
          LPU_NO_EXTENSIONS: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: The pure Python modules must work
        run: |
          python -c "import lpu; print('lpu', lpu.__version__)"
          python -c "from lpu.common import config, files, logging, progress, text"
          python -c "from lpu.metrics import bleu, ribes; print(ribes.eval_ribes(list('abc'), list('abc')))"
        working-directory: ${{ runner.temp }}

      - name: Run the test suite (extension tests skip themselves)
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -v
        working-directory: ${{ runner.temp }}
